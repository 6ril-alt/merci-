<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merci !</title>
    <style>
        /* Supprime toutes les marges et met le fond en noir par sécurité */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden; /* Empêche les barres de défilement */
        }

        /* Fait en sorte que le GIF occupe tout l'écran */
        .fullscreen-gif {
            width: 100vw;
            height: 100vh;
            object-fit: cover; /* Remplit tout l'écran en gardant les proportions (ou utilise 'fill' si tu veux qu'il s'étire complètement) */
            display: block;
        }
    </style>
</head>
<body>

    <!-- Le GIF en plein écran -->
    <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExZHI2b2ExMXQ0OXM5MHZjMms1ZXRxOGdxM2x6azZxamNvM3FvMm83NiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/10UUe8ZsLnaqwo/giphy.gif" alt="GIF plein écran" class="fullscreen-gif">

</body>
</html>
